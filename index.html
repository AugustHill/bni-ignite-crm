<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Log In | BNI Ignite Growth CRM</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-card">
  <p class="eyebrow">BNI Ignite</p>
  <h1>Growth CRM</h1>
  <p class="subtitle">Log in to continue.</p>
  <form id="login-form">
    <div class="form-group">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" required autocomplete="username">
    </div>
    <div class="form-group">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn--primary" style="width:100%;">Log In</button>
    <p class="error-msg" id="login-error"></p>
  </form>
  <p style="text-align:center; margin-top:14px; margin-bottom:0;">
    <a href="#" id="forgot-password-link" style="font-size:0.85rem;">Forgot your password?</a>
  </p>
  <div id="forgot-password-section" style="display:none; margin-top:16px; padding-top:16px; border-top:1px dashed var(--color-border);">
    <div class="form-group">
      <label for="reset-email">Email</label>
      <input type="email" id="reset-email">
    </div>
    <button type="button" class="btn btn--outline" id="send-reset-btn" style="width:100%;">Send Reset Link</button>
    <p class="error-msg" id="reset-error"></p>
    <p class="success-msg" id="reset-success"></p>
  </div>
</div>

<script src="js/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  let client = null;
  try {
    client = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  } catch (err) {
    console.error('Supabase is not configured yet:', err.message);
  }

  const loginForm = document.getElementById('login-form');
  const loginError = document.getElementById('login-error');

  async function goToRoleHome() {
    const { data: { session } } = await client.auth.getSession();
    if (!session) return;
    const { data: profile, error } = await client
      .from('profiles')
      .select('role')
      .eq('id', session.user.id)
      .single();
    if (error || !profile) {
      loginError.textContent = "Logged in, but no profile is set up for this account yet. See README.md.";
      await client.auth.signOut();
      return;
    }
    window.location.href = profile.role === 'caller' ? 'caller.html' : 'admin.html';
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginError.textContent = '';
    if (!client) {
      loginError.textContent = "This app isn't connected yet. Add your Supabase URL/key to js/supabase-config.js.";
      return;
    }
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    const { error } = await client.auth.signInWithPassword({ email, password });
    if (error) {
      loginError.textContent = error.message;
      return;
    }
    goToRoleHome();
  });

  document.getElementById('forgot-password-link').addEventListener('click', (e) => {
    e.preventDefault();
    const section = document.getElementById('forgot-password-section');
    const showing = section.style.display !== 'none';
    section.style.display = showing ? 'none' : 'block';
    if (!showing) document.getElementById('reset-email').value = document.getElementById('login-email').value;
  });

  document.getElementById('send-reset-btn').addEventListener('click', async () => {
    const errEl = document.getElementById('reset-error');
    const okEl = document.getElementById('reset-success');
    errEl.textContent = '';
    okEl.textContent = '';
    if (!client) { errEl.textContent = "This app isn't connected yet."; return; }
    const email = document.getElementById('reset-email').value.trim();
    if (!email) { errEl.textContent = 'Enter your email first.'; return; }
    const { error } = await client.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/account.html',
    });
    if (error) { errEl.textContent = error.message; return; }
    okEl.textContent = 'If that email has an account, a reset link is on its way. Check your inbox (and spam folder).';
  });

  if (client) goToRoleHome();
</script>
</body>
</html>
