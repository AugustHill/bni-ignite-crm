<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>GPS Plan | BNI Ignite Growth CRM</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .priority-title-input { font-family: var(--font-heading); font-size: 1.15rem; font-weight: 700; border: 1px solid transparent; background: transparent; padding: 4px 6px; border-radius: 6px; width: 100%; margin-bottom: 14px; }
  .priority-title-input:hover, .priority-title-input:focus { border-color: var(--color-border); background: var(--color-bg); }
  .priority-title-input:disabled { color: var(--color-text); opacity: 1; cursor: default; }
  .priority-num { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: var(--color-primary); color: #fff; font-size: 0.75rem; font-weight: 700; margin-right: 8px; flex-shrink: 0; }
  .goal-edit-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; margin-top: 14px; }
  @media (max-width: 700px) { .goal-edit-grid { grid-template-columns: 1fr; } }
  .action-text:disabled, .action-done:disabled { opacity: 1; cursor: default; -webkit-text-fill-color: var(--color-text); }
  .readonly-banner { background: var(--color-bg-alt); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 10px 16px; margin-bottom: 20px; font-size: 0.85rem; color: var(--color-text-muted); }
</style>
</head>
<body>

<div class="wrap wrap--narrow">
  <div class="page-header">
    <div>
      <p class="eyebrow" id="page-eyebrow">BNI Ignite · GPS Plan</p>
      <h1 id="page-title">1 Goal · 3 Priorities · 5 Strategies</h1>
      <p class="subtitle" id="page-subtitle">Goals, Priorities, and Strategies for your Growth Coordinator role.</p>
    </div>
    <div class="header-actions">
      <a class="btn btn--outline btn--sm" id="back-link" href="admin.html">Back</a>
    </div>
  </div>

  <div id="readonly-banner" class="readonly-banner" style="display:none;">You're viewing this plan, not editing it. It belongs to the person it's for.</div>

  <div class="card">
    <h2>1. Goal</h2>
    <div id="goal-view"><p class="empty-state">Loading…</p></div>
    <details id="goal-edit-details" style="margin-top:14px;">
      <summary style="cursor:pointer; font-size:0.85rem; font-weight:700; color: var(--color-primary);">Edit goal</summary>
      <form id="goal-form" class="goal-edit-grid">
        <div class="form-group" style="grid-column: 1 / -1;">
          <label for="g-text">Goal</label>
          <input type="text" id="g-text" required>
        </div>
        <div class="form-group">
          <label for="g-start">Starting Members</label>
          <input type="number" id="g-start" required>
        </div>
        <div class="form-group">
          <label for="g-target">Target Members</label>
          <input type="number" id="g-target" required>
        </div>
        <div class="form-group">
          <label for="g-date">Target Date</label>
          <input type="date" id="g-date" required>
        </div>
        <div style="grid-column: 1 / -1;">
          <button type="submit" class="btn btn--primary btn--sm">Save Goal</button>
          <p class="error-msg" id="goal-error"></p>
        </div>
      </form>
    </details>
  </div>

  <div id="priorities-container"><p class="empty-state">Loading priorities…</p></div>
</div>

<script src="js/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/session.js"></script>
<script>
  let client, profile, targetId, readOnly;

  function renderGoal(goal) {
    document.getElementById('goal-view').innerHTML = `
      <p style="font-size:1.05rem; margin:0 0 4px;">${goal.goal_text}</p>
      <p class="hint">${goal.starting_number} &rarr; ${goal.target_number} members by ${new Date(goal.target_date + 'T00:00:00').toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' })}</p>
    `;
    if (readOnly) return;
    document.getElementById('g-text').value = goal.goal_text;
    document.getElementById('g-start').value = goal.starting_number;
    document.getElementById('g-target').value = goal.target_number;
    document.getElementById('g-date').value = goal.target_date;
  }

  async function loadGoal() {
    const { data, error } = await client.from('gps_goal').select('*').eq('owner_id', targetId).maybeSingle();
    if (error || !data) {
      document.getElementById('goal-view').innerHTML = '<p class="empty-state">No goal set yet.</p>';
      return;
    }
    renderGoal(data);
  }

  document.getElementById('goal-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('goal-error');
    errEl.textContent = '';
    const payload = {
      goal_text: document.getElementById('g-text').value.trim(),
      starting_number: parseInt(document.getElementById('g-start').value, 10),
      target_number: parseInt(document.getElementById('g-target').value, 10),
      target_date: document.getElementById('g-date').value,
    };
    const { error } = await client.from('gps_goal').update(payload).eq('owner_id', targetId);
    if (error) { errEl.textContent = error.message; return; }
    renderGoal(payload);
  });

  async function loadPriorities() {
    const container = document.getElementById('priorities-container');
    const [{ data: priorities, error: pErr }, { data: actions, error: aErr }] = await Promise.all([
      client.from('gps_priorities').select('*').eq('owner_id', targetId).order('sort_order'),
      client.from('gps_actions').select('*, gps_priorities!inner(owner_id)').eq('gps_priorities.owner_id', targetId).order('sort_order'),
    ]);

    if (pErr || !priorities) {
      container.innerHTML = `<p class="empty-state">Couldn't load priorities: ${pErr ? pErr.message : ''}</p>`;
      return;
    }
    if (!priorities.length) {
      container.innerHTML = '<p class="empty-state">Nothing here yet.</p>';
      return;
    }

    const actionsByPriority = {};
    (actions || []).forEach((a) => {
      (actionsByPriority[a.priority_id] = actionsByPriority[a.priority_id] || []).push(a);
    });

    const dis = readOnly ? 'disabled' : '';

    container.innerHTML = priorities.map((p, idx) => `
      <div class="card" data-priority="${p.id}">
        <h2>2. Priority ${idx + 1}</h2>
        <input type="text" class="priority-title-input" data-id="${p.id}" value="${p.title}" ${dis}>
        <p class="hint" style="margin-top:-8px; margin-bottom:14px;">3. Five action strategies for this priority</p>
        <ul class="checklist">
          ${(actionsByPriority[p.id] || []).map((a, i) => `
            <li>
              <span class="priority-num">${i + 1}</span>
              <input type="checkbox" class="action-done" data-id="${a.id}" ${a.done ? 'checked' : ''} ${dis}>
              <input type="text" class="action-text" data-id="${a.id}" value="${a.text || ''}" placeholder="Strategy ${i + 1}…" ${dis}>
            </li>
          `).join('')}
        </ul>
      </div>
    `).join('');

    container.querySelectorAll('.action-done').forEach((cb) => {
      if (cb.checked) cb.closest('li').querySelector('.action-text').style.textDecoration = 'line-through';
    });

    if (readOnly) return;

    container.querySelectorAll('.priority-title-input').forEach((input) => {
      input.addEventListener('blur', async () => {
        await client.from('gps_priorities').update({ title: input.value.trim() }).eq('id', input.dataset.id);
      });
    });
    container.querySelectorAll('.action-text').forEach((input) => {
      input.addEventListener('blur', async () => {
        await client.from('gps_actions').update({ text: input.value.trim() }).eq('id', input.dataset.id);
      });
    });
    container.querySelectorAll('.action-done').forEach((cb) => {
      cb.addEventListener('change', async () => {
        await client.from('gps_actions').update({ done: cb.checked }).eq('id', cb.dataset.id);
        cb.closest('li').querySelector('.action-text').style.textDecoration = cb.checked ? 'line-through' : 'none';
      });
    });
  }

  // Auto-creates a blank 1 goal / 3 priorities / 5 actions-each template the
  // first time someone opens their own plan, so nobody has to manually
  // insert rows before they can start filling it in.
  async function ensureMyPlanExists() {
    const { data: existing } = await client.from('gps_goal').select('owner_id').eq('owner_id', profile.id).maybeSingle();
    if (existing) return;

    const inOneYear = new Date();
    inOneYear.setDate(inOneYear.getDate() + 365);

    await client.from('gps_goal').insert({
      owner_id: profile.id,
      goal_text: 'Set your goal…',
      starting_number: 0,
      target_number: 0,
      target_date: inOneYear.toISOString().slice(0, 10),
    });

    const { data: newPriorities } = await client.from('gps_priorities').insert([
      { owner_id: profile.id, title: 'Priority 1', sort_order: 1 },
      { owner_id: profile.id, title: 'Priority 2', sort_order: 2 },
      { owner_id: profile.id, title: 'Priority 3', sort_order: 3 },
    ]).select();

    const actionRows = [];
    (newPriorities || []).forEach((p) => {
      for (let i = 1; i <= 5; i++) actionRows.push({ priority_id: p.id, sort_order: i });
    });
    if (actionRows.length) await client.from('gps_actions').insert(actionRows);
  }

  (async () => {
    try {
      const result = await requireSession();
      client = result.client;
      profile = result.profile;

      const params = new URLSearchParams(window.location.search);
      const requestedId = params.get('user');
      targetId = requestedId || profile.id;
      readOnly = !!requestedId && requestedId !== profile.id;

      document.getElementById('back-link').href = profile.role === 'coordinator' ? 'admin.html' : 'caller.html';

      if (readOnly) {
        document.getElementById('readonly-banner').style.display = 'block';
        document.getElementById('goal-edit-details').style.display = 'none';
        const { data: targetProfile } = await client.from('profiles').select('full_name').eq('id', targetId).maybeSingle();
        const name = targetProfile ? targetProfile.full_name : 'Their';
        document.getElementById('page-eyebrow').textContent = `BNI Ignite · ${name}'s GPS Plan`;
        document.getElementById('page-title').textContent = `${name}'s 1-3-5`;
        document.getElementById('page-subtitle').textContent = `Goals, Priorities, and Strategies for ${name}.`;
      } else {
        await ensureMyPlanExists();
      }

      loadGoal();
      loadPriorities();
    } catch (err) {
      console.error(err.message);
    }
  })();
</script>
</body>
</html>
